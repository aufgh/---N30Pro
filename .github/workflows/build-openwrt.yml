name: Build OpenWrt for Netcore N30 Pro

on:
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'patches/**'
      - 'files/**'
      - 'tests/**'
      - '.github/workflows/build-openwrt.yml'
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: n30pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate UA3F lifecycle
      run: python3 tests/test_ua3f_lifecycle.py

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl libelf-dev time xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        chmod +x diy-part1.sh diy-part2.sh

    - name: Load custom feeds
      run: |
        cd openwrt
        ../diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install -f -d y -p passwall_luci luci-app-passwall
        ./scripts/feeds install -f -d y -p passwall_packages sing-box geoview v2ray-geoip v2ray-geosite chinadns-ng dns2socks ipt2socks microsocks tcping
        make -C package/openclash/luci-app-openclash/tools/po2lmo
        sudo make -C package/openclash/luci-app-openclash/tools/po2lmo install

    - name: Load custom configuration
      run: |
        mv .config openwrt/.config
        cd openwrt
        ../diy-part2.sh
        make defconfig
        required_configs=(
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_USE_APK=y
          CONFIG_PACKAGE_ua3f=y
          CONFIG_PACKAGE_hev-socks5-tproxy=y
          CONFIG_PACKAGE_libubox-lua=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          CONFIG_PACKAGE_luci-app-multilogin=y
          CONFIG_PACKAGE_openlist=y
          CONFIG_PACKAGE_luci-app-openlist=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-app-syncdial=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_ruby-psych=y
          CONFIG_PACKAGE_ruby-pstore=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_kmod-macvlan=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-samba4=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_geoview=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-net-aqc111=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-lan78xx=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_r8152-firmware=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_wwan=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_relayd=y
          CONFIG_PACKAGE_luci-proto-relay=y
          CONFIG_PACKAGE_ddns-scripts-services=y
          CONFIG_PACKAGE_avahi-dbus-daemon=y
          CONFIG_PACKAGE_wsdd2=y
          CONFIG_PACKAGE_wpad-openssl=y
        )
        missing=0
        for config in "${required_configs[@]}"; do
          grep -Fqx "$config" .config || {
            echo "::error::Required config was dropped by make defconfig: $config"
            missing=1
          }
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        if grep -Fqx 'CONFIG_PACKAGE_dnsmasq=y' .config; then
          echo "::error::dnsmasq conflicts with dnsmasq-full"
          exit 1
        fi
        if grep -Eq '^CONFIG_PACKAGE_(luci-app-store|luci-lib-taskd|luci-lib-xterm|taskd|script-utils|luci-app-statistics|collectd|collectd-mod-[^=]+)=[ym]$' .config; then
          echo "::error::iStore and statistics collectors must not be preinstalled"
          exit 1
        fi
        if grep -Eq '^CONFIG_PACKAGE_(UAmask|luci-app-uamask|ua2f|luci-app-ua2f)=[ym]$' .config; then
          echo "::error::UA-Mask and UA2F must not be included alongside UA3F"
          exit 1
        fi

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        required_artifacts=(
          'ua3f-*.apk'
          'hev-socks5-tproxy-*.apk'
          'luci-app-multilogin-*.apk'
          'openlist-*.apk'
          'luci-app-openlist-*.apk'
          'zerotier-*.apk'
          'luci-app-zerotier-*.apk'
          'luci-app-openclash-*.apk'
          'luci-app-passwall-*.apk'
          'sing-box-*.apk'
          'luci-theme-argon-*.apk'
        )
        for pattern in "${required_artifacts[@]}"; do
          artifact="$(find bin/packages -type f -name "$pattern" -print -quit)"
          if [ -z "$artifact" ]; then
            echo "::error::Required package was not compiled: $pattern"
            exit 1
          fi
          echo "Verified package: $artifact"
        done
        manifest="$(find bin/targets -type f -name '*.manifest' -print -quit)"
        if [ -z "$manifest" ]; then
          echo "::error::Firmware package manifest is missing"
          exit 1
        fi
        for package in ua3f hev-socks5-tproxy luci-app-multilogin luci-app-syncdial luci-app-openclash luci-app-argon-config luci-app-ddns luci-app-firewall luci-app-package-manager luci-app-passwall luci-app-samba4 luci-app-sqm luci-app-ttyd luci-app-upnp luci-app-wol luci-theme-argon luci-theme-bootstrap sing-box geoview v2ray-geoip v2ray-geosite openlist luci-app-openlist zerotier luci-app-zerotier; do
          grep -Eq "^${package} - " "$manifest" || {
            echo "::error::Required package is missing from the firmware: $package"
            exit 1
          }
        done
        if grep -Eiq '^(UAmask|luci-app-uamask|ua2f|luci-app-ua2f|luci-app-store|luci-lib-taskd|luci-lib-xterm|taskd|script-utils|luci-app-statistics|collectd|collectd-mod-[^ ]+) - ' "$manifest"; then
          echo "::error::An excluded UA-Mask, UA2F, iStore or statistics package was found in the firmware"
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success'
      with:
        tag_name: openwrt_n30pro_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
