name: Build OpenWrt for Netcore N30 Pro

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl libelf-dev time xsltproc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        chmod +x diy-part1.sh diy-part2.sh

    - name: Load custom feeds
      run: |
        cd openwrt
        ../diy-part1.sh
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make -C package/openclash/luci-app-openclash/tools/po2lmo
        sudo make -C package/openclash/luci-app-openclash/tools/po2lmo install

    - name: Load custom configuration
      run: |
        mv .config openwrt/.config
        cd openwrt
        ../diy-part2.sh
        make defconfig
        required_configs=(
          CONFIG_PACKAGE_UAmask=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_nftset=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_ruby-psych=y
          CONFIG_PACKAGE_ruby-pstore=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_openlist=y
          CONFIG_PACKAGE_luci-app-openlist=y
        )
        for config in "${required_configs[@]}"; do
          grep -Fqx "$config" .config || {
            echo "::error::Required config was dropped by make defconfig: $config"
            exit 1
          }
        done
        if grep -Fqx 'CONFIG_PACKAGE_dnsmasq=y' .config; then
          echo "::error::dnsmasq conflicts with dnsmasq-full"
          exit 1
        fi
        if grep -Fqx 'CONFIG_PACKAGE_luci-app-zerotier=y' .config; then
          echo "::error::ZeroTier must not be included"
          exit 1
        fi

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        required_artifacts=(
          'UAmask-*.apk'
          'luci-app-openclash-*.apk'
          'openlist-*.apk'
          'luci-app-openlist-*.apk'
        )
        for pattern in "${required_artifacts[@]}"; do
          artifact="$(find bin/packages -type f -name "$pattern" -print -quit)"
          if [ -z "$artifact" ]; then
            echo "::error::Required package was not compiled: $pattern"
            exit 1
          fi
          echo "Verified package: $artifact"
        done
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success'
      with:
        tag_name: openwrt_n30pro_${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
